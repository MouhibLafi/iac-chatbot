# =====================================================================
# Manifeste OpenShift - Service
# Genere par IaC Chatbot (Thymeleaf)
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: [[${appName}]]
  labels:
    app: [[${appName}]]
    generated-by: iac-chatbot
spec:
  selector:
    app: [[${appName}]]
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
