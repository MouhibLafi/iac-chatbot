# ==============================================================================
# IaC Chatbot - Configuration PRODUCTION (MySQL Community)
# Activee avec : SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

server.port=8081
spring.application.name=iac-chatbot

# Ollama (service Docker "ollama" dans docker-compose)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://ollama:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:llama3}
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.num-predict=500

# MySQL Community 8.0 (service Docker "mysql")
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:iac_chatbot}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:iac_user}
spring.datasource.password=${DB_PASSWORD:iac_password}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway desactive (Hibernate gere le schema en prod simple)
spring.flyway.enabled=false

# JWT
jwt.secret=${JWT_SECRET:change-me-in-production-this-is-a-very-long-secret-key-for-jwt}
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.company.iacchatbot=INFO
logging.level.org.springframework.ai=INFO

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Thymeleaf (generation IaC via IaCTemplateConfig)
spring.thymeleaf.check-template-location=false

# CORS (origine du frontend Angular en production)
cors.allowed-origins=${CORS_ORIGINS:http://localhost}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ==============================================================================
# Deploiement (UC-06) : simulation (defaut) ou real
# En mode real, le backend doit tourner sur la machine hote (VBoxManage/oc)
# ==============================================================================
deploy.mode=${DEPLOY_MODE:simulation}
deploy.workdir=${DEPLOY_WORKDIR:./deploy-work}
deploy.vboxmanage-path=${VBOXMANAGE_PATH:VBoxManage}
deploy.oc-bin=${OC_BIN:oc}
deploy.oc-server=${OC_SERVER:}
deploy.oc-token=${OC_TOKEN:}
deploy.command-timeout-seconds=300
