# ==============================================================================
# IaC Chatbot - Configuration Principale
# Version 100% GRATUITE
# ==============================================================================

# Server Configuration
server.port=8081
spring.application.name=iac-chatbot

# ==============================================================================
# Ollama Configuration (100% LOCAL ET GRATUIT)
# ==============================================================================
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=llama3
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.num-predict=500

# ==============================================================================
# Database Configuration - H2 (Development)
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:iac_chatbot
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (accessible à http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================================================
# Flyway Database Migration
# ==============================================================================
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==============================================================================
# JWT Configuration
# ==============================================================================
jwt.secret=${JWT_SECRET:change-me-in-production-this-is-a-very-long-secret-key-for-jwt}
jwt.expiration=86400000

# ==============================================================================
# Logging
# ==============================================================================
logging.level.root=INFO
logging.level.com.company.iacchatbot=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==============================================================================
# Swagger/OpenAPI Configuration (GRATUIT)
# ==============================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ==============================================================================
# Thymeleaf (generation IaC: voir IaCTemplateConfig - moteur TEXT dedie)
# Templates: classpath:/templates/terraform/*.tf et classpath:/templates/openshift/*.yaml
# ==============================================================================
spring.thymeleaf.check-template-location=false

# ==============================================================================
# Workflow d'approbation (UC-12)
# Si true : les demandes générées passent en PENDING_APPROVAL (validation admin requise)
# ==============================================================================
app.approval.required=false

# ==============================================================================
# Notifications Discord (webhook - vide = notifications loguées seulement)
# ==============================================================================
# Discord Webhook (notifications gratuites) - definir la variable d'environnement DISCORD_WEBHOOK_URL
# Le service NotificationService lit directement ${DISCORD_WEBHOOK_URL:} (vide = desactive)

# ==============================================================================
# CORS Configuration
# ==============================================================================
cors.allowed-origins=http://localhost:4200
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ==============================================================================
# File Upload
# ==============================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==============================================================================
# Deploiement (UC-06) : simulation (defaut) ou real
# real : VM -> VirtualBox (VBoxManage sur la machine hote)
#        OpenShift -> oc apply/delete (cluster configure via OC_SERVER/OC_TOKEN)
# ==============================================================================
deploy.mode=${DEPLOY_MODE:simulation}
deploy.workdir=${DEPLOY_WORKDIR:./deploy-work}
deploy.vboxmanage-path=${VBOXMANAGE_PATH:VBoxManage}
deploy.oc-bin=${OC_BIN:oc}
deploy.oc-server=${OC_SERVER:}
deploy.oc-token=${OC_TOKEN:}
deploy.command-timeout-seconds=300
