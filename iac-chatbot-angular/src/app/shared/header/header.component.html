<header class="header">
  <div class="header-content">
    <div class="header-left">
      <img src="geniac-logo.svg" alt="Geniac" class="app-logo">
      <div>
        <h1>Geniac</h1>
        <p>Générateur d'Infrastructure as Code</p>
      </div>
    </div>

    <div class="header-right">
      @if (authService.currentUser(); as user) {
        <div class="user-menu">
          <!-- Bouton qui ouvre / ferme le menu -->
          <button
            type="button"
            class="menu-toggle"
            [class.open]="menuOpen()"
            (click)="toggleMenu()"
          >
            <span class="menu-avatar">{{ user.username.charAt(0).toUpperCase() }}</span>
            <span class="menu-username">{{ user.username }}</span>
            <span
              class="role-badge"
              [class.role-admin]="authService.isAdmin()"
              [class.role-user]="!authService.isAdmin()"
            >{{ roleLabel(user.role) }}</span>
            <span class="chevron">▾</span>
          </button>

          @if (menuOpen()) {
            <!-- Fond transparent : clic dehors = fermeture -->
            <div class="menu-overlay" (click)="closeMenu()"></div>

            <!-- Liste déroulante -->
            <nav class="menu-dropdown">
              <a routerLink="/chat" routerLinkActive="active" class="menu-item" (click)="closeMenu()">
                💬 Chat
              </a>
              <a routerLink="/history" routerLinkActive="active" class="menu-item" (click)="closeMenu()">
                📜 Historique
              </a>
              @if (authService.isAdmin()) {
                <a routerLink="/admin" routerLinkActive="active" class="menu-item admin-item" (click)="closeMenu()">
                  ⚙️ Admin
                </a>
              }
              <div class="menu-divider"></div>
              <button type="button" class="menu-item logout-item" (click)="logout()">
                🚪 Déconnexion
              </button>
            </nav>
          }
        </div>
      }
    </div>
  </div>
</header>
